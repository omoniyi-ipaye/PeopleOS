name: SentimentEngine Forensic Validation

on:
  pull_request:
    paths:
      - 'src/sentiment_engine.py'
      - 'api/routes/sentiment.py'
      - 'api/schemas/sentiment.py'
      - 'tests/test_sentiment_engine_forensic_cycle023.py'
      - 'tests/test_analytics_accuracy.py'
      - 'tests/test_people_team_acceptance.py'
      - 'tests/test_extended_integrity.py'
      - 'tests/test_specialist_measurement_fixes.py'
      - 'tests/test_specialist_review_findings.py'
      - '.github/workflows/sentiment-engine-forensic.yml'
      - 'model/quality_cycle_023_sentiment_engine_final.json'
  workflow_dispatch:

jobs:
  forensic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - name: Record sentiment source digests
        run: |
          sha256sum src/sentiment_engine.py
          sha256sum api/routes/sentiment.py
          sha256sum api/schemas/sentiment.py
      - name: Install validation dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Run SentimentEngine forensic contracts
        run: >-
          pytest -q
          tests/test_sentiment_engine_forensic_cycle023.py
          tests/test_analytics_accuracy.py
          tests/test_people_team_acceptance.py
          tests/test_extended_integrity.py
          tests/test_specialist_measurement_fixes.py
          tests/test_specialist_review_findings.py
