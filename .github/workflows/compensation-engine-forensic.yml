name: CompensationEngine Forensic Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/compensation_engine.py'
      - 'src/population.py'
      - 'tests/test_compensation_engine_forensic_cycle009.py'
      - 'scripts/stress_compensation_engine_cycle009.py'
      - '.github/workflows/compensation-engine-forensic.yml'

permissions:
  contents: read

jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CompensationEngine-only validation dependencies
        run: python -m pip install pandas==2.1.4 numpy==1.26.3 scipy==1.15.3 pytest==9.0.3 pyyaml==6.0.1
      - name: Run CompensationEngine forensic contracts
        run: pytest -q tests/test_compensation_engine_forensic_cycle009.py
      - name: Run 250k-row CompensationEngine stress harness
        run: python scripts/stress_compensation_engine_cycle009.py --rows 250000 --output compensation-engine-cycle009-stress.json
      - name: Preserve CompensationEngine forensic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compensation-engine-cycle009-evidence
          path: compensation-engine-cycle009-stress.json
          if-no-files-found: warn
