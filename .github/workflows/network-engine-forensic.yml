name: NetworkEngine Forensic Validation

on:
  pull_request:
    paths:
      - 'src/network_engine.py'
      - 'api/routes/network.py'
      - 'tests/test_network_engine_forensic_cycle019.py'
      - 'tests/test_analytics_accuracy.py'
      - 'tests/test_engine_renderer_integrity.py'
      - '.github/workflows/network-engine-forensic.yml'
      - 'model/engine_audit_review_updates.json'
      - 'model/quality_cycle_019_network_engine_final.json'
  workflow_dispatch:

jobs:
  forensic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - name: Record network source digests
        run: |
          sha256sum src/network_engine.py
          sha256sum api/routes/network.py
      - name: Install validation dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Run NetworkEngine forensic contracts
        run: >-
          pytest -q
          tests/test_network_engine_forensic_cycle019.py
          tests/test_analytics_accuracy.py
          tests/test_engine_renderer_integrity.py

