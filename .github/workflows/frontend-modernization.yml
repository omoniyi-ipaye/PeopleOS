name: Frontend Modernization

on:
  push:
    branches:
      - upgrade/agent-system-foundation
    paths:
      - 'web/**'
      - '.github/workflows/frontend-modernization.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'web/**'

permissions:
  contents: write

jobs:
  build-and-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Resolve upgraded dependency graph
        run: npm install

      - name: Audit production dependency security
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit regenerated lockfile
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        working-directory: .
        run: |
          if git diff --quiet -- web/package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json
          git commit -m "Regenerate frontend lockfile for Next.js 16"
          git push
