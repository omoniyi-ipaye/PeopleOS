name: Frontend Modernization

on:
  push:
    branches:
      - main
      - upgrade/agent-system-foundation
    paths:
      - 'web/**'
      - '.github/workflows/frontend-modernization.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/frontend-modernization.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependency graph
        run: npm ci

      - name: Audit production dependency security
        run: npm audit --omit=dev --audit-level=high

      - name: Validate design-system governance
        run: npm run design:check

      - name: Lint
        run: npm run lint

      - name: Verify analytics renderer contracts
        run: npm run test:analytics

      - name: Build
        run: npm run build
