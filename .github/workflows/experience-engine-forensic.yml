name: ExperienceEngine Forensic Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/experience_engine.py'
      - 'tests/test_experience_engine_forensic_cycle010.py'
      - 'scripts/stress_experience_engine_cycle010.py'
      - '.github/workflows/experience-engine-forensic.yml'

permissions:
  contents: read

jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ExperienceEngine-only validation dependencies
        run: python -m pip install pandas==2.1.4 numpy==1.26.3 scipy==1.15.3 pytest==9.0.3 pyyaml==6.0.1
      - name: Run ExperienceEngine forensic contracts
        run: pytest -q tests/test_experience_engine_forensic_cycle010.py
      - name: Run 250k-row ExperienceEngine stress harness
        run: python scripts/stress_experience_engine_cycle010.py --rows 250000 --output experience-engine-cycle010-stress.json
      - name: Preserve ExperienceEngine forensic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experience-engine-cycle010-evidence
          path: experience-engine-cycle010-stress.json
          if-no-files-found: warn
