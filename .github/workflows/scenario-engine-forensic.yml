name: ScenarioEngine Forensic Validation

on:
  pull_request:
    paths:
      - 'src/scenario_engine.py'
      - 'api/routes/scenario.py'
      - 'api/schemas/scenario.py'
      - 'tests/test_scenario_engine_forensic_cycle022.py'
      - 'web/app/scenario-planner/page.tsx'
      - 'web/tests/scenario-planner-cycle022.test.cjs'
      - '.github/workflows/scenario-engine-forensic.yml'
      - 'model/quality_cycle_022_scenario_engine_final.json'
  workflow_dispatch:

jobs:
  forensic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - name: Record ScenarioEngine source digests
        run: |
          sha256sum src/scenario_engine.py
          sha256sum api/routes/scenario.py
          sha256sum api/schemas/scenario.py
      - name: Install validation dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Run ScenarioEngine forensic contracts
        run: pytest -q tests/test_scenario_engine_forensic_cycle022.py
      - name: Run Scenario Planner UI contracts
        run: node --test web/tests/scenario-planner-cycle022.test.cjs
