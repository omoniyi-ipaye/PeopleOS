name: ClusteringEngine Forensic Validation

on:
  pull_request:
    paths:
      - 'src/clustering_engine.py'
      - 'api/routes/analytics.py'
      - 'tests/test_clustering_engine_forensic_cycle015.py'
      - '.github/workflows/clustering-engine-forensic.yml'
      - 'model/engine_audit_review_updates.json'
      - 'model/quality_cycle_015_clustering_engine_final.json'
  workflow_dispatch:

jobs:
  forensic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Record ClusteringEngine source digest
        run: sha256sum src/clustering_engine.py
      - name: Install ClusteringEngine dependencies
        run: python -m pip install pandas==2.1.4 numpy==1.26.3 pytest==9.0.3 scikit-learn==1.5.2 pyyaml==6.0.1
      - name: Run ClusteringEngine forensic contracts
        run: pytest -q tests/test_clustering_engine_forensic_cycle015.py
