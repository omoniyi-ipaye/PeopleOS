name: CausalEngine Forensic Validation

on:
  pull_request:
    paths:
      - 'src/causal_engine.py'
      - 'api/routes/causal.py'
      - 'tests/test_causal_engine_forensic_cycle014.py'
      - '.github/workflows/causal-engine-forensic.yml'
      - 'model/engine_audit_review_updates.json'
      - 'model/quality_cycle_014_causal_engine_final.json'
  workflow_dispatch:

jobs:
  forensic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CausalEngine dependencies
        run: python -m pip install pandas==2.1.4 numpy==1.26.3 pytest==9.0.3
      - name: Run CausalEngine forensic contracts
        run: pytest -q tests/test_causal_engine_forensic_cycle014.py
