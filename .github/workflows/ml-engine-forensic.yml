name: MLEngine Forensic Validation

on:
  pull_request:
    paths:
      - 'src/ml_engine.py'
      - 'src/model_training.py'
      - 'src/platform/model_lifecycle.py'
      - 'src/platform/provenance.py'
      - 'api/routes/predictions.py'
      - 'api/routes/platform.py'
      - 'tests/test_ml_engine_forensic_cycle017.py'
      - 'tests/test_ml_engine.py'
      - 'tests/test_launch_ml_contract.py'
      - 'tests/test_predictive_release_contract.py'
      - '.github/workflows/ml-engine-forensic.yml'
      - 'model/engine_audit_review_updates.json'
      - 'model/quality_cycle_017_ml_engine_final.json'
  workflow_dispatch:

jobs:
  forensic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - name: Record predictive source digests
        run: |
          sha256sum src/ml_engine.py
          sha256sum src/model_training.py
      - name: Install predictive validation dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Run MLEngine forensic and release contracts
        run: >-
          pytest -q
          tests/test_ml_engine_forensic_cycle017.py
          tests/test_ml_engine.py
          tests/test_launch_ml_contract.py
          tests/test_predictive_release_contract.py
          tests/test_model_validation.py
