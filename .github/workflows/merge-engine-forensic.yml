name: MergeEngine Forensic Validation

on:
  pull_request:
    paths:
      - 'src/merge_engine.py'
      - 'src/database.py'
      - 'src/population.py'
      - 'tests/test_merge_engine.py'
      - 'tests/test_merge_engine_forensic_cycle016.py'
      - '.github/workflows/merge-engine-forensic.yml'
      - 'model/engine_audit_review_updates.json'
      - 'model/quality_cycle_016_merge_engine_final.json'
  workflow_dispatch:

jobs:
  forensic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Record MergeEngine source digest
        run: sha256sum src/merge_engine.py
      - name: Install MergeEngine dependencies
        run: python -m pip install pandas==2.1.4 numpy==1.26.3 pytest==9.0.3 pyyaml==6.0.1
      - name: Run MergeEngine forensic and compatibility contracts
        run: pytest -q tests/test_merge_engine_forensic_cycle016.py tests/test_merge_engine.py
