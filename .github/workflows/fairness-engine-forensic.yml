name: FairnessEngine Forensic Validation

on:
  pull_request:
    paths:
      - 'src/fairness_engine.py'
      - 'tests/test_fairness_engine_forensic_cycle011.py'
      - '.github/workflows/fairness-engine-forensic.yml'
      - 'model/engine_audit_review_updates.json'
      - 'model/quality_cycle_011_fairness_engine_final.json'
  workflow_dispatch:

jobs:
  forensic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FairnessEngine-only dependencies
        run: python -m pip install pandas==2.1.4 numpy==1.26.3 pytest==9.0.3 pyyaml==6.0.1
      - name: Run FairnessEngine forensic contracts
        run: pytest -q tests/test_fairness_engine_forensic_cycle011.py
