name: NLPEngine Forensic Validation

on:
  pull_request:
    paths:
      - 'src/nlp_engine.py'
      - 'api/routes/nlp.py'
      - 'tests/test_nlp_engine.py'
      - 'tests/test_nlp_engine_forensic_cycle020.py'
      - 'tests/test_engine_renderer_integrity.py'
      - 'tests/test_snapshot_recovery.py'
      - '.github/workflows/nlp-engine-forensic.yml'
      - 'model/quality_cycle_020_nlp_engine_final.json'
  workflow_dispatch:

jobs:
  forensic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - name: Record NLP source digests
        run: |
          sha256sum src/nlp_engine.py
          sha256sum api/routes/nlp.py
      - name: Install validation dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Run NLP forensic contracts
        run: >-
          pytest -q
          tests/test_nlp_engine_forensic_cycle020.py
          tests/test_nlp_engine.py
          tests/test_engine_renderer_integrity.py
          tests/test_snapshot_recovery.py
