name: VectorEngine Forensic Validation

on:
  pull_request:
    paths:
      - 'src/vector_engine.py'
      - 'api/routes/search.py'
      - 'ui/components.py'
      - 'web/app/search/page.tsx'
      - 'web/types/api.ts'
      - 'tests/test_vector_engine_forensic_cycle027.py'
      - 'tests/test_vector_engine.py'
      - 'tests/test_real_vector_contract.py'
      - 'tests/test_extended_integrity.py'
      - 'scripts/validate_vector_engine_cycle027.py'
      - 'scripts/validate_local_embeddings.py'
      - 'requirements-advanced.txt'
      - '.github/workflows/vector-engine-forensic.yml'
      - 'model/quality_cycle_027_vector_engine_final.json'
      - 'model/quality_cycle_027_vector_relevance_benchmark.json'
  workflow_dispatch:

jobs:
  forensic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - name: Record VectorEngine source digests
        run: |
          sha256sum src/vector_engine.py
          sha256sum api/routes/search.py
      - name: Install validation dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Install real vector benchmark dependencies
        run: python -m pip install -r requirements-advanced.txt
      - name: Run VectorEngine forensic contracts
        run: >-
          pytest -q
          tests/test_vector_engine_forensic_cycle027.py
          tests/test_vector_engine.py
          tests/test_real_vector_contract.py
          tests/test_extended_integrity.py
      - name: Run real multilingual vector relevance benchmark
        run: >-
          python scripts/validate_local_embeddings.py
          --output vector-relevance-benchmark.json
      - name: Upload vector relevance evidence
        uses: actions/upload-artifact@v4
        with:
          name: vector-relevance-benchmark
          path: vector-relevance-benchmark.json
