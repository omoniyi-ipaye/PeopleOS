name: E2E User Journey

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - 'src/**'
      - 'web/**'
      - 'tests/e2e/**'
      - 'sample_hr_data.csv'
      - 'requirements*.txt'
      - '.github/workflows/e2e-user-journey.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  user-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PEOPLEOS_API_HOST: 127.0.0.1
      PEOPLEOS_API_PORT: '8000'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-core.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install core backend and browser dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Verify advanced transformer stack is not required
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec('torch') is None, 'core install unexpectedly pulled torch'
          assert importlib.util.find_spec('sentence_transformers') is None, 'core install unexpectedly pulled sentence-transformers'
          print('Core runtime dependency boundary: PASS')
          PY

      - name: Install locked frontend dependencies
        working-directory: web
        run: npm ci

      - name: Start FastAPI backend
        run: |
          mkdir -p artifacts/e2e
          nohup python -m uvicorn api.main:app --host 127.0.0.1 --port 8000 > artifacts/e2e/backend.log 2>&1 &
          echo $! > artifacts/e2e/backend.pid

      - name: Start Next.js frontend
        working-directory: web
        run: |
          nohup npm run dev -- --hostname 127.0.0.1 --port 3000 > ../artifacts/e2e/frontend.log 2>&1 &
          echo $! > ../artifacts/e2e/frontend.pid

      - name: Run end-to-end user journey
        run: python tests/e2e/user_journey.py

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peopleos-e2e-evidence
          path: artifacts/e2e/
          if-no-files-found: warn
          retention-days: 14
