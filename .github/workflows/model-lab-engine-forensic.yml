name: ModelLabEngine Forensic Validation

on:
  pull_request:
    paths:
      - 'src/model_lab_engine.py'
      - 'src/ml_engine.py'
      - 'src/platform/provenance.py'
      - 'api/routes/model_lab.py'
      - 'tests/test_model_lab_engine_forensic_cycle018.py'
      - 'tests/test_model_validation.py'
      - 'tests/test_predictive_release_contract.py'
      - '.github/workflows/model-lab-engine-forensic.yml'
      - 'model/engine_audit_review_updates.json'
      - 'model/quality_cycle_018_model_lab_engine_final.json'
  workflow_dispatch:

jobs:
  forensic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - name: Record Model Lab source digests
        run: |
          sha256sum src/model_lab_engine.py
          sha256sum api/routes/model_lab.py
      - name: Install validation dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Run ModelLabEngine forensic and predictive contracts
        run: >-
          pytest -q
          tests/test_model_lab_engine_forensic_cycle018.py
          tests/test_model_validation.py
          tests/test_predictive_release_contract.py
          tests/test_ml_engine_forensic_cycle017.py
