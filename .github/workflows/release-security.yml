name: Release Security

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - name: Install pinned audit tooling
        run: npm install --global npm@10.9.8 --ignore-scripts
      - name: Audit the complete frontend lockfile
        working-directory: web
        run: npm audit --package-lock-only --audit-level=low --json > npm-audit.json
      - name: Preserve frontend audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-dependency-audit
          path: web/npm-audit.json
          if-no-files-found: warn

  python-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        requirements:
          - requirements-desktop.txt
          - requirements-core.txt
          - requirements-advanced.txt
          - requirements-validation.txt
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.13'
      - name: Install isolated pinned audit tooling
        run: |
          python -m venv "$RUNNER_TEMP/dependency-audit"
          "$RUNNER_TEMP/dependency-audit/bin/python" -m pip install pip-audit==2.9.0
      - name: Resolve and audit runtime dependencies
        env:
          REQUIREMENTS_FILE: ${{ matrix.requirements }}
        run: >-
          "$RUNNER_TEMP/dependency-audit/bin/pip-audit"
          --requirement "$REQUIREMENTS_FILE"
          --progress-spinner off --format json --output python-audit.json
      - name: Preserve Python audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-audit-${{ matrix.requirements }}
          path: python-audit.json
          if-no-files-found: warn
