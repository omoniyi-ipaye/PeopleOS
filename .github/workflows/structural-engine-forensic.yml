name: StructuralEngine Forensic Validation

on:
  pull_request:
    paths:
      - 'src/structural_engine.py'
      - 'api/routes/structural.py'
      - 'api/schemas/structural.py'
      - 'web/components/glossary-modal.tsx'
      - 'tests/test_structural_engine_forensic_cycle024.py'
      - 'tests/test_engine_renderer_integrity.py'
      - 'web/tests/structural-renderers.test.cjs'
      - '.github/workflows/structural-engine-forensic.yml'
      - 'model/quality_cycle_024_structural_engine_final.json'
  workflow_dispatch:

jobs:
  forensic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - name: Record structural source digests
        run: |
          sha256sum src/structural_engine.py
          sha256sum api/routes/structural.py
          sha256sum api/schemas/structural.py
      - name: Install validation dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Run StructuralEngine forensic contracts
        run: >-
          pytest -q
          tests/test_structural_engine_forensic_cycle024.py
          tests/test_engine_renderer_integrity.py
          tests/test_analytics_accuracy.py
          -k "structural"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run structural renderer contracts
        run: node --test web/tests/structural-renderers.test.cjs
