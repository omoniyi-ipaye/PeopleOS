name: Agent Foundation

on:
  push:
    branches:
      - main
      - upgrade/agent-system-foundation
  pull_request:
    branches:
      - main

jobs:
  agent-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install agent test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas pydantic pyyaml fastapi scikit-learn

      - name: Compile governed platform modules
        run: python -m compileall -q src/agent src/platform src/safe_llm_client.py api/security.py api/routes/intelligence.py api/routes/platform.py

      - name: Validate canonical system model
        run: python scripts/validate_system_model.py

      - name: Run agent and platform architecture tests
        run: >-
          pytest -q
          tests/test_agent_evidence.py
          tests/test_agent_orchestrator.py
          tests/test_safe_llm_client.py
          tests/test_agent_controls.py
          tests/test_platform_architecture.py
