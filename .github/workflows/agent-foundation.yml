name: Agent Foundation

on:
  push:
    branches:
      - main
      - upgrade/agent-system-foundation
  pull_request:
    branches:
      - main

jobs:
  agent-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install architecture and integrity test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas numpy scipy pydantic pyyaml fastapi==0.133.0 starlette==1.3.1 httpx==0.27.2 scikit-learn==1.5.2 python-multipart==0.0.31

      - name: Compile governed integrity modules and API boundaries
        run: >-
          python -m compileall -q
          src/agent
          src/platform
          src/local_paths.py
          src/population.py
          src/preprocessor.py
          src/analytics_engine.py
          src/compensation_engine.py
          src/fairness_engine.py
          src/safe_llm_client.py
          desktop
          api/dependencies.py
          api/security.py
          api/authorization.py
          api/routes/intelligence.py
          api/routes/platform.py
          api/routes/analytics.py
          api/routes/compensation.py
          api/routes/quality_of_hire.py
          api/routes/experience.py
          api/routes/scenario.py
          api/routes/survival.py
          api/routes/predictions.py
          api/routes/succession.py
          api/routes/structural.py
          api/routes/causal.py

      - name: Validate canonical system model
        run: python scripts/validate_system_model.py

      - name: Verify build readiness invariants
        run: python scripts/check_build_readiness.py

      - name: Run architecture and output-integrity tests
        run: >-
          pytest -q
          tests/test_agent_evidence.py
          tests/test_agent_orchestrator.py
          tests/test_source_label_display.py tests/test_cloud_acceptance_contract.py
          tests/test_safe_llm_client.py
          tests/test_agent_controls.py
          tests/test_agentic_launch_matrix.py
          tests/test_enterprise_controls_matrix.py
          tests/test_platform_architecture.py
          tests/test_platform_operations.py
          tests/test_output_integrity.py
          tests/test_local_distribution.py
