name: Refresh Frontend Lockfile

on:
  push:
    branches: [main]
    paths:
      - 'web/package.json'
      - '.github/workflows/refresh-lockfile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Regenerate lockfile
        working-directory: web
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify locked install and production audit
        working-directory: web
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- web/package-lock.json; then
            echo 'Lockfile already synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/package-lock.json
          git commit -m 'Sync frontend lockfile for Zustand 5'
          git pull --rebase origin main
          git push origin HEAD:main
