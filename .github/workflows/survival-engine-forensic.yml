name: SurvivalEngine Forensic Validation

on:
  pull_request:
    paths:
      - 'src/survival_engine.py'
      - 'tests/test_survival_engine_forensic_cycle013.py'
      - 'tests/test_survival_engine_forensic_cycle013_semantics.py'
      - 'scripts/stress_survival_engine_cycle013.py'
      - '.github/workflows/survival-engine-forensic.yml'
      - 'model/engine_audit_review_updates.json'
      - 'model/quality_cycle_013_survival_engine_final.json'
  workflow_dispatch:

jobs:
  forensic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Record SurvivalEngine source digest
        run: sha256sum src/survival_engine.py
      - name: Install SurvivalEngine dependencies
        run: python -m pip install pandas==2.1.4 numpy==1.26.3 pytest==9.0.3 lifelines==0.30.3 scipy==1.15.3 pyyaml==6.0.1
      - name: Run SurvivalEngine forensic contracts
        run: pytest -q tests/test_survival_engine_forensic_cycle013.py tests/test_survival_engine_forensic_cycle013_semantics.py
      - name: Run SurvivalEngine 250k stress harness
        if: success()
        run: python scripts/stress_survival_engine_cycle013.py --rows 250000 --output survival-engine-cycle013-stress.json
      - name: Preserve SurvivalEngine forensic evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: survival-engine-cycle013-evidence
          path: survival-engine-cycle013-stress.json
          retention-days: 90
