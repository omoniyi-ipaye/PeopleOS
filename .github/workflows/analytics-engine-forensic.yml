name: AnalyticsEngine Forensic Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/analytics_engine.py'
      - 'src/population.py'
      - 'tests/test_analytics_engine_forensic_cycle008.py'
      - 'scripts/stress_analytics_engine_cycle008.py'
      - '.github/workflows/analytics-engine-forensic.yml'

permissions:
  contents: read

jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install AnalyticsEngine-only validation dependencies
        run: python -m pip install pandas==2.1.4 numpy==1.26.3 scipy==1.15.3 pytest==9.0.3 pyyaml==6.0.1
      - name: Run AnalyticsEngine forensic contracts
        run: pytest -q tests/test_analytics_engine_forensic_cycle008.py
      - name: Run 250k-row AnalyticsEngine stress harness
        run: python scripts/stress_analytics_engine_cycle008.py --rows 250000 --output analytics-engine-cycle008-stress.json
      - name: Preserve AnalyticsEngine forensic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-engine-cycle008-evidence
          path: analytics-engine-cycle008-stress.json
          if-no-files-found: warn
