name: Local Desktop Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'scripts/bundle_desktop.py'
      - 'tests/test_desktop_bundle.py'
      - 'LICENSE'
      - 'NOTICE*'
      - 'THIRD_PARTY*'
      - 'licenses/**'
      - 'README.md'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'docs/PUBLIC_BETA_GUIDE.md'
      - 'docs/releases/**'
      - 'docs/beta/**'
      - 'docs/architecture/LOCAL_DISTRIBUTION.md'
      - 'src/local_paths.py'
      - 'src/utils.py'
      - 'src/platform/**'
      - 'api/**'
      - 'web/**'
      - 'tests/local_restart_probe.py'
      - 'tests/desktop_smoke_probe.py'
      - 'requirements-desktop.txt'
      - 'requirements-predictive.txt'
      - 'config.yaml'
      - 'sample_hr_data.csv'
      - 'data/templates/**'
      - '.github/workflows/local-desktop-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'scripts/bundle_desktop.py'
      - 'tests/test_desktop_bundle.py'
      - 'LICENSE'
      - 'NOTICE*'
      - 'THIRD_PARTY*'
      - 'licenses/**'
      - 'README.md'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'docs/PUBLIC_BETA_GUIDE.md'
      - 'docs/releases/**'
      - 'docs/beta/**'
      - 'docs/architecture/LOCAL_DISTRIBUTION.md'
      - 'src/local_paths.py'
      - 'src/utils.py'
      - 'src/platform/**'
      - 'api/**'
      - 'web/**'
      - 'tests/local_restart_probe.py'
      - 'tests/desktop_smoke_probe.py'
      - 'requirements-desktop.txt'
      - 'requirements-predictive.txt'
      - 'config.yaml'
      - 'sample_hr_data.csv'
      - 'data/templates/**'
      - '.github/workflows/local-desktop-build.yml'

jobs:
  package:
    name: package-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
            artifact: PeopleOS-linux-x64
          - platform: windows-x64
            os: windows-latest
            artifact: PeopleOS-windows-x64
          - platform: macos-arm64
            os: macos-14
            artifact: PeopleOS-macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-desktop.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build static PeopleOS UI
        working-directory: web
        env:
          PEOPLEOS_DESKTOP_BUILD: '1'
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          npm ci
          npm run build

      - name: Verify static UI export
        shell: bash
        run: |
          test -f web/out/index.html
          test -d web/out/_next

      - name: Install local runtime and packager
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt
          pip install pyinstaller==6.16.0

      - name: Verify predictive training stack is optional
        run: |
          python -c "import importlib.util; assert importlib.util.find_spec('xgboost') is None; assert importlib.util.find_spec('optuna') is None; assert importlib.util.find_spec('streamlit') is None; print('Slim desktop capability boundary PASS')"

      - name: Verify workspace survives process restart
        env:
          PEOPLEOS_HOME: ${{ runner.temp }}/peopleos-restart-home
        run: |
          python tests/local_restart_probe.py load
          python tests/local_restart_probe.py restore

      - name: Verify release bundle contract
        run: python -m unittest discover -s tests -p test_desktop_bundle.py

      - name: Build self-contained PeopleOS executable
        run: pyinstaller --noconfirm --clean desktop/peopleos.spec

      - name: Smoke-test packaged application
        env:
          PEOPLEOS_SMOKE_TEST: '1'
          PEOPLEOS_HOME: ${{ runner.temp }}/peopleos-smoke-home
        run: python tests/desktop_smoke_probe.py

      - name: Report package size
        shell: bash
        run: |
          if [ -f dist/PeopleOS.exe ]; then du -h dist/PeopleOS.exe; else du -h dist/PeopleOS; fi

      - name: Bundle smoke-tested application with provenance and checksums
        run: python scripts/bundle_desktop.py --platform ${{ matrix.platform }} --revision ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Upload local application
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/PeopleOS-${{ matrix.platform }}.*
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
