name: Analytics Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths: ['src/**', 'api/**', 'tests/**', 'scripts/**', 'requirements*.txt', 'config.yaml', '.github/workflows/analytics-validation.yml']

permissions:
  contents: read

jobs:
  known_answers_and_benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Run arithmetic, model isolation, API integrity and regression checks
        run: >-
          pytest -q
          tests/test_analytics_accuracy.py tests/test_engine_integrity_cycle007.py tests/test_analytics_engine_forensic_cycle008.py tests/test_model_validation.py
          tests/test_extended_integrity.py
          tests/test_engine_renderer_integrity.py tests/test_engine_audit_inventory.py tests/test_merge_engine.py
          tests/test_analytics_engine.py tests/test_compensation_engine.py
          tests/test_preprocessor.py tests/test_experience_engine.py
          tests/test_scenario_engine.py tests/test_nlp_engine.py
          tests/test_team_dynamics_engine.py tests/test_succession_engine.py
          tests/test_output_integrity.py tests/test_platform_architecture.py
          tests/test_local_distribution.py
          tests/test_specialist_review_findings.py tests/test_specialist_measurement_fixes.py
          tests/test_runtime_integrity.py tests/test_snapshot_recovery.py
          tests/test_people_team_acceptance.py tests/test_agentic_acceptance.py
          tests/test_enterprise_controls.py tests/test_enterprise_recovery.py
          tests/test_enterprise_recovery_api.py
          tests/test_analytics_launch_matrix.py tests/test_ml_engine.py
          tests/test_agentic_launch_matrix.py tests/test_enterprise_controls_matrix.py
          tests/test_synthetic_stress_validation.py
          tests/test_data_loader.py tests/test_database.py tests/test_integration.py
          tests/test_pa_validation.py tests/test_performance.py tests/test_vector_engine.py
          tests/test_launch_input_contract.py tests/test_launch_salary_history.py
          tests/test_launch_ml_contract.py tests/test_launch_agent_grounding.py
          tests/test_launch_succession_evidence.py
          tests/test_local_llm_transport.py tests/test_real_vector_contract.py
          tests/test_predictive_release_contract.py tests/test_agent_language_contract.py
          tests/test_pay_confirmation.py
          tests/test_source_label_display.py tests/test_cloud_acceptance_contract.py
      - name: Run independent arithmetic oracle harness
        run: python scripts/engine_integrity_cycle007.py --output engine-integrity-cycle007.json
      - name: Stress AnalyticsEngine at 250k rows
        run: python scripts/stress_analytics_engine_cycle008.py --rows 250000 --output analytics-engine-cycle008-stress.json
      - name: Verify public benchmarks and random-label controls
        run: python scripts/benchmark_analytics.py --output benchmark-results.json
      - name: Stress deterministic analytics with a fictional organization
        run: python scripts/synthetic_stress_validation.py --rows 20000 --live-api --output synthetic-stress-results.json
      - name: Verify live application with controlled dummy datasets
        run: python scripts/live_dummy_acceptance.py --output live-acceptance-results
      - name: Publish versioned benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-benchmark-evidence
          path: |
            engine-integrity-cycle007.json
            analytics-engine-cycle008-stress.json
            benchmark-results.json
            synthetic-stress-results.json
            live-acceptance-results/
          if-no-files-found: warn
