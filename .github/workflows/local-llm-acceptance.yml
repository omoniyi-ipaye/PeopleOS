name: Local Ollama Acceptance

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['src/**', 'api/**', 'config.yaml', 'scripts/validate_local_llm.py', 'scripts/validate_local_llm_api.py', 'scripts/validate_cloud_llm.py', 'requirements*.txt', '.github/workflows/local-llm-acceptance.yml']

permissions:
  contents: read

concurrency:
  group: local-llm-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local_cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OLLAMA_VERSION: '0.6.8'
      OLLAMA_HOST: '127.0.0.1:11434'
      OLLAMA_NUM_PARALLEL: '1'
      CUDA_VISIBLE_DEVICES: '-1'
      HIP_VISIBLE_DEVICES: '-1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Configure isolated runtime paths
        run: |
          echo "OLLAMA_MODELS=$RUNNER_TEMP/ollama-models" >> "$GITHUB_ENV"
          echo "PEOPLEOS_HOME=$RUNNER_TEMP/peopleos-local-acceptance" >> "$GITHUB_ENV"
          echo "PEOPLEOS_WORKSPACE_REGISTRY=$RUNNER_TEMP/peopleos-local-acceptance/workspaces.json" >> "$GITHUB_ENV"
          echo "PEOPLEOS_AGENT_AUDIT_PATH=$RUNNER_TEMP/peopleos-local-acceptance/audit.jsonl" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record exact source and acceptance scope
        run: |
          mkdir -p local-llm-evidence
          git rev-parse HEAD > local-llm-evidence/source-commit.txt
          git status --porcelain > local-llm-evidence/source-status.txt
          cp config.yaml local-llm-evidence/config.yaml
          echo 'Real CPU Ollama; shipped gemma3:4b configuration; synthetic selector and live API only. No browser, desktop or predictive validity claim.' > local-llm-evidence/scope.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - name: Install acceptance dependencies
        timeout-minutes: 3
        run: timeout --signal=TERM 140s python -m pip install -r requirements-validation.txt > local-llm-evidence/pip.log 2>&1
      - name: Install pinned official Ollama release
        timeout-minutes: 3
        run: |
          set -euo pipefail
          curl --fail --location --connect-timeout 15 --max-time 110 "https://github.com/ollama/ollama/releases/download/v${OLLAMA_VERSION}/ollama-linux-amd64.tgz" -o "$RUNNER_TEMP/ollama.tgz"
          sha256sum "$RUNNER_TEMP/ollama.tgz" > local-llm-evidence/runtime-archive.sha256
          mkdir -p "$RUNNER_TEMP/ollama-runtime"
          tar -xzf "$RUNNER_TEMP/ollama.tgz" -C "$RUNNER_TEMP/ollama-runtime"
          echo "$RUNNER_TEMP/ollama-runtime/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ollama-runtime/bin/ollama" serve > local-llm-evidence/ollama-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:11434/api/version > local-llm-evidence/runtime-version.json; then break; fi
            sleep 1
          done
          python -c 'import json, os; assert json.load(open("local-llm-evidence/runtime-version.json"))["version"] == os.environ["OLLAMA_VERSION"]'
      - name: Pull the configured local model
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # Ollama resumes partial layers, so retry once if a hosted runner has a transient
          # bandwidth collapse. This does not weaken the model/digest or inference gates.
          if ! timeout --signal=TERM 420s ollama pull gemma3:4b > local-llm-evidence/model-pull.log 2>&1; then
            echo 'Initial pull did not complete; retrying resumable pull.' >> local-llm-evidence/model-pull.log
            timeout --signal=TERM 120s ollama pull gemma3:4b >> local-llm-evidence/model-pull.log 2>&1
          fi
          curl --fail --silent http://127.0.0.1:11434/api/tags > local-llm-evidence/installed-models.json
          python - <<'PY'
          import json
          data = json.load(open('local-llm-evidence/installed-models.json'))
          names = {m.get('model') or m.get('name') for m in data.get('models', [])}
          assert 'gemma3:4b' in names, f'Configured model missing after pull: {sorted(n for n in names if n)}'
          PY
          curl --fail --silent --max-time 90 http://127.0.0.1:11434/api/generate -H 'Content-Type: application/json' -d '{"model":"gemma3:4b","prompt":"","stream":false,"keep_alive":"10m","options":{"num_predict":1}}' > local-llm-evidence/model-warmup.json
      - name: Strict real local selector acceptance
        id: selector
        timeout-minutes: 3
        run: timeout --signal=TERM 140s python scripts/validate_local_llm.py --output local-llm-evidence/selector.json > local-llm-evidence/selector.log 2>&1
      - name: Live production API with local model
        if: ${{ !cancelled() && steps.selector.outcome != 'skipped' }}
        timeout-minutes: 3
        run: timeout --signal=TERM 150s python scripts/validate_local_llm_api.py --output local-llm-evidence/live-api.json > local-llm-evidence/live-api.log 2>&1
      - name: Record runtime residency and final source state
        if: always()
        run: |
          curl --max-time 5 --silent http://127.0.0.1:11434/api/ps > local-llm-evidence/runtime-residency.json || true
          git status --porcelain > local-llm-evidence/final-source-status.txt
      - name: Preserve local evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-ollama-${{ github.event.pull_request.head.sha || github.sha }}
          path: local-llm-evidence/
          if-no-files-found: error
          retention-days: 14
